<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Will you forgive me?</title>
<style>
  :root {
    --bg: #ffffff; --card: #ffffff; --text: #3a2a2e;
    --yes: #e11d48; --yes-text: #ffffff; --no: #e5e7eb; --no-text: #4b5563;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; overflow-x: hidden; overflow-y: auto;
  }
  .card {
    background: var(--card); border-radius: 24px; padding: 24px;
    max-width: 420px; width: calc(100% - 32px); margin: auto; text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,.12);
  }
  .stage { width: var(--w); height: var(--h); margin: 0 auto 8px; border-radius: 20px; overflow: hidden; background: #fff; }
  .sprite { width: var(--w); height: var(--h); background-repeat: no-repeat; background-size: calc(var(--w) * 6) var(--h); }
  h1 { font-size: 1.5rem; margin: 12px 0 8px; }
  p { margin: 0 0 24px; opacity: .85; }
  .buttons { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
  button { border: 0; border-radius: 999px; cursor: pointer; font: inherit; font-weight: 600; padding: 12px 28px; transition: all .2s ease; }
  #yes { background: var(--yes); color: var(--yes-text); font-size: 1rem; }
  #no  { background: var(--no);  color: var(--no-text);  font-size: 1rem; }
  #yes.full { position: fixed; inset: 0; border-radius: 0; z-index: 10; font-size: 2.5rem; padding: 0; }
  #done { display: none; }
</style>
</head>
<body>
  <div class="card">
    <div class="stage" style="--w:189px;--h:210px"><div id="dog" class="sprite" style="--w:189px;--h:210px"></div></div>
    <div id="ask">
      <h1 id="title"></h1>
      <p id="msg"></p>
      <div class="buttons">
        <button id="yes">Yes 💗</button>
        <button id="no">No</button>
      </div>
    </div>
    <div id="done">
      <h1 id="doneTitle"></h1>
      <p id="doneMsg"></p>
    </div>
  </div>

  var FW = 189, FRAMES = 6;

  var dog = document.getElementById("dog");
  var yes = document.getElementById("yes");
  var no = document.getElementById("no");
  var count = 0, frame = 0, pi = 0, playlist = ["sad"], timer = null;

  function show() {
    dog.style.backgroundImage = "url(" + SHEETS[playlist[pi]] + ")";
    dog.style.backgroundPosition = (-frame * FW) + "px 0";
  }
  function tick() {
    frame++;
    if (frame === FRAMES) { frame = 0; pi = (pi + 1) % playlist.length; }
    show();
  }
  function play(list, ms) {
    playlist = list; pi = 0; frame = 0; show();
    clearInterval(timer);
    timer = setInterval(tick, ms);
  }

  document.getElementById("title").textContent = CONFIG.name + ", " + CONFIG.title;
  document.getElementById("msg").textContent = CONFIG.message;
  play(["sad"], CONFIG.sadMs);

  no.addEventListener("click", function () {
    count++;
    no.textContent = CONFIG.noTexts[Math.min(count, CONFIG.noTexts.length - 1)];
    if (count >= CONFIG.fullAt) { yes.classList.add("full"); return; }
    yes.style.fontSize = (1 + count * 0.35) + "rem";
    yes.style.padding = (12 + count * 5) + "px " + (28 + count * 10) + "px";
    no.style.fontSize = Math.max(0.6, 1 - count * 0.06) + "rem";
  });

  yes.addEventListener("click", function () {
    document.getElementById("ask").style.display = "none";
    document.getElementById("done").style.display = "block";
    document.getElementById("doneTitle").textContent = CONFIG.doneTitle;
    document.getElementById("doneMsg").textContent = CONFIG.doneMessage;
    yes.classList.remove("full");
    play(["happy", "hop"], CONFIG.happyMs);
  });
</script>
